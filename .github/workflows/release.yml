name: Publish stable macOS Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '重试尚未公开的正式版本 tag（vX.Y.Z）'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate requested tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify stable tag matches application version
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" --check-version
      - run: npm ci
      - run: npm run setup:electron
      - run: npm test
      - run: npm run build
      - name: Build matching ZIP and DMG
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate assets and native bundle
        run: |
          node scripts/prepare-release.mjs "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          export CWB_UPDATE_ZIP="$GITHUB_WORKSPACE/release/Clever-Workbench-$version-arm64.zip"
          npx vitest run tests/update-download.test.ts
          node scripts/verify-electron-update-extraction.mjs "$CWB_UPDATE_ZIP"
          node scripts/verify-electron-update-transport.mjs "$CWB_UPDATE_ZIP"
          hdiutil verify "release/Clever-Workbench-$version-arm64.dmg"
          mkdir -p release/installed
          ditto -x -k "$CWB_UPDATE_ZIP" release/installed
          codesign --verify --deep --strict 'release/installed/Clever Workbench.app'
          echo "CWB_TEST_EXECUTABLE=$GITHUB_WORKSPACE/release/installed/Clever Workbench.app/Contents/MacOS/Clever Workbench" >> "$GITHUB_ENV"
      - name: Test installed application
        run: npm run test:e2e
      - name: Create draft, upload complete assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-cloud.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          if-no-files-found: ignore
          path: |
            release/SHA256SUMS
            release/uploaded.json
            release/verification.json
            test-results/
