name: Desktop build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clever-workbench-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            test-results/
