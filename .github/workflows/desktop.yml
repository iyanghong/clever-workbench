name: Desktop package and runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npm test
      - run: npm run build
      - name: Package macOS arm64
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install macOS ZIP in isolated directory
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/installed
          version=$(node -p 'require("./package.json").version')
          ditto -x -k "release/Clever-Workbench-$version-arm64.zip" release/installed
          codesign --verify --deep --strict 'release/installed/Clever Workbench.app'
          echo "CWB_TEST_EXECUTABLE=$GITHUB_WORKSPACE/release/installed/Clever Workbench.app/Contents/MacOS/Clever Workbench" >> "$GITHUB_ENV"
      - name: Package Windows x64
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Install Windows package and record actual OS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'workbench-installed'
          $version = node -p 'require("./package.json").version'
          $installer = Get-Item "release/Clever Workbench Setup $version.exe"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = Join-Path $destination 'Clever Workbench.exe'
          if (!(Test-Path $executable)) { throw 'Installed executable is missing.' }
          "CWB_TEST_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | ConvertTo-Json | Set-Content 'release/actual-windows.json'
          Get-AuthenticodeSignature $installer.FullName | Select-Object Status,StatusMessage | ConvertTo-Json | Set-Content 'release/windows-signature.json'
      - name: Test installed application
        run: npm run test:e2e
      - name: Export packaged Mac migration fixture
        if: runner.os == 'macOS'
        run: node scripts/verify-migration.mjs "$CWB_TEST_EXECUTABLE" release/migration/mac-ci
      - name: Import Mac fixture and export on actual Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/verify-migration.mjs "$env:CWB_TEST_EXECUTABLE" release/migration/windows-return .scratch/desktop-workbench/evidence/migration/mac-seed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-${{ runner.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: release/migration/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clever-workbench-${{ runner.os }}
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.json
            release/migration/
            test-results/
