<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clever Workbench · 台账设计稿</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--soft:#f8f9fb;--text:#20242b;--secondary:#626b78;--muted:#8a939f;--line:#e4e8ed;--accent:#1671e8;--accent-soft:#eaf2ff;--green:#238562;--green-soft:#e8f5ee;--orange:#a76217;--shadow:0 12px 36px rgba(24,38,56,.08);--radius:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);font-size:13px}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button{border:0;color:inherit;background:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #79aef5;outline-offset:2px}svg{display:block;flex-shrink:0}button svg{pointer-events:none}.app{display:grid;grid-template-columns:218px minmax(0,1fr);height:100vh;min-width:900px;background:var(--bg)}
    .sidebar{display:flex;flex-direction:column;padding:24px 14px 16px;background:#edf1f5;border-right:1px solid #dde3e9}.traffic{display:flex;gap:7px;margin:0 8px 25px}.traffic i{width:10px;height:10px;border-radius:50%;background:#fa655b}.traffic i:nth-child(2){background:#f6bd3c}.traffic i:nth-child(3){background:#62c64a}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#1976e9;color:#fff}.brand strong{display:block;font-size:14px}.brand small{display:block;margin-top:3px;color:var(--secondary);font-size:11px}.side-label{padding:0 12px 8px;color:var(--muted);font-size:10px;letter-spacing:1.4px}.side-nav{display:grid;gap:4px}.side-nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#4d5866;text-align:left}.side-nav button.active{background:#dce9f9;color:#1265c5;font-weight:600}.side-bottom{margin-top:auto;display:grid;gap:5px}.side-status{margin:16px 10px;padding:12px 0;border-top:1px solid #d9dfe6;color:var(--secondary);font-size:11px}.side-status span{display:flex;align-items:center;gap:6px;margin-top:7px}.dot{width:6px;height:6px;border-radius:50%;background:#37a376;display:inline-block}
    .workspace{display:flex;flex-direction:column;min-width:0;min-height:0}.globalbar{height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.8)}.global-search{display:flex;align-items:center;gap:9px;width:min(480px,46vw);padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted)}.global-search input{width:100%;border:0;outline:0;background:none;color:var(--text)}.global-search kbd{margin-left:auto;font-size:10px;font-family:inherit}.global-actions{display:flex;align-items:center;gap:10px;margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;white-space:nowrap}.btn:hover{background:#f5f7fa}.btn.primary{border-color:#1671e8;background:#1671e8;color:#fff}.btn.ghost{border-color:transparent;background:transparent;color:var(--secondary)}.btn.icon{width:32px;padding:0}.systembar{display:flex;align-items:center;gap:12px;padding:20px 30px 14px}.system-picker{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:650}.system-picker svg{color:#63748a}.system-meta{color:var(--muted);font-size:11px}.systembar .global-actions{margin-left:auto}.content{flex:1;min-height:0;overflow:auto;padding:0 30px 80px}.demo-switch{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border:1px solid #dce2e9;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 10px 32px #26384d22;backdrop-filter:blur(16px)}.demo-switch button{padding:8px 13px;border-radius:8px;color:var(--secondary);font-size:12px;white-space:nowrap}.demo-switch button.active{background:#202a38;color:#fff}.demo-switch small{display:block;font-size:9px;font-weight:400;opacity:.75;margin-top:2px}
    .category-tabs{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#e9edf2;overflow-x:auto}.category-tabs button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;color:var(--secondary);white-space:nowrap;font-size:12px}.category-tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px #1d304214;font-weight:600}.category-head{display:flex;align-items:center;gap:12px;margin:18px 0 14px}.category-title{display:flex;align-items:center;gap:9px}.category-title h1{margin:0;font-size:20px;letter-spacing:-.4px}.category-title span{color:var(--muted);font-size:11px}.category-head .global-actions{margin-left:auto}.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px}.search{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:none;color:var(--text)}select{padding:9px 30px 9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--secondary)}.count-line{display:flex;align-items:center;gap:8px;margin:14px 2px 9px;color:var(--muted);font-size:11px}.count-line strong{color:var(--secondary);font-weight:500}.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px;background:#eef1f5;color:var(--secondary);font-size:10px;white-space:nowrap}.badge.green{background:var(--green-soft);color:var(--green)}.badge.blue{background:var(--accent-soft);color:var(--accent)}.badge.orange{background:#fff1df;color:var(--orange)}.record-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#edf3fb;color:#3472b9;flex-shrink:0}.record-icon.server{background:#eaf4ef;color:#398064}.record-icon.account{background:#f3effa;color:#8060a7}.record-icon.document{background:#fff2e5;color:#a46b25}.muted{color:var(--muted)}.secondary{color:var(--secondary)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:60px;text-align:center;color:var(--muted)}
    .native-table{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}.native-table table{width:100%;border-collapse:collapse;table-layout:fixed}.native-table th{height:38px;padding:0 16px;border-bottom:1px solid var(--line);background:#fafbfc;color:var(--muted);font-size:10px;font-weight:500;text-align:left;letter-spacing:.4px}.native-table td{height:64px;padding:10px 16px;border-bottom:1px solid #edf0f3;vertical-align:middle}.native-table tr:last-child td{border-bottom:0}.native-table tbody tr{transition:background .12s}.native-table tbody tr:hover{background:#f7faff}.native-table tbody tr.selected{background:#f1f6fd}.native-table th:nth-child(1){width:29%}.native-table th:nth-child(2){width:25%}.native-table th:nth-child(3){width:27%}.native-table th:nth-child(4){width:19%}.name-cell{display:flex;align-items:center;gap:11px;min-width:0}.name-cell strong{display:block;margin-bottom:4px;font-size:13px;font-weight:600}.name-cell small{display:block;color:var(--muted);font-size:10px}.row-actions{display:flex;align-items:center;gap:5px}.row-actions button{padding:5px 7px;border-radius:6px;color:var(--secondary);font-size:11px}.row-actions button:hover{background:#e9eff7;color:var(--accent)}.native-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.metric strong{display:block;font-size:17px;line-height:1.1}.metric small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.metric svg{color:#6a7d94}
    .card-hero{display:flex;align-items:end;justify-content:space-between;margin:20px 0 16px;padding:22px 24px;border:1px solid #dfe6ef;border-radius:14px;background:linear-gradient(120deg,#fff,#f2f7fd)}.card-hero h1{margin:0 0 7px;font-size:23px;letter-spacing:-.5px}.card-hero p{margin:0;color:var(--secondary)}.card-hero .hero-count{font-size:34px;font-weight:650;color:#2071cd;line-height:1}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record-card{position:relative;padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:transform .14s,border-color .14s,box-shadow .14s}.record-card:hover{transform:translateY(-1px);border-color:#bdd2ec;box-shadow:0 8px 22px #223c5710}.record-card.selected{border-color:#81ade8;box-shadow:0 0 0 2px #e3efff}.card-top{display:flex;align-items:center;gap:11px}.card-top .badge{margin-left:auto}.record-card h3{margin:0;font-size:14px;font-weight:600}.card-value{margin:17px 0 10px;color:#283849;font-size:13px;overflow-wrap:anywhere}.card-note{min-height:20px;margin:0;color:var(--secondary);font-size:12px;line-height:1.6}.card-foot{display:flex;align-items:center;gap:8px;margin-top:15px;padding-top:11px;border-top:1px solid #edf0f3;color:var(--muted);font-size:10px}.card-foot button{display:flex;align-items:center;gap:5px;margin-left:auto;color:var(--accent)}
    .focus-layout{display:grid;grid-template-columns:170px 350px minmax(330px,1fr);gap:0;height:calc(100vh - 215px);min-height:520px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.focus-categories{padding:14px 10px;border-right:1px solid var(--line);background:#f7f9fb}.focus-categories button{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border-radius:7px;color:var(--secondary);text-align:left;font-size:12px}.focus-categories button.active{background:#e5eef9;color:#1769c4;font-weight:600}.focus-categories button span{margin-left:auto;color:var(--muted);font-size:10px}.focus-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.focus-list-head{padding:14px 12px 10px;border-bottom:1px solid var(--line)}.focus-list-head h1{margin:0 0 12px;font-size:17px}.focus-list-head .search{padding:8px 10px}.focus-list-head select{width:100%;margin-top:8px}.focus-rows{overflow:auto}.focus-row{display:block;width:100%;padding:14px 15px;border-bottom:1px solid #edf0f3;text-align:left}.focus-row:hover{background:#f7faff}.focus-row.selected{background:#edf4fd;box-shadow:inset 2px 0 var(--accent)}.focus-row strong{display:block;margin-bottom:6px;font-size:13px}.focus-row .trunc{color:var(--secondary);font-size:11px}.focus-row small{display:block;margin-top:7px;color:var(--muted);font-size:10px}.focus-detail{overflow:auto;padding:25px 27px}.detail-eyebrow{color:var(--muted);font-size:10px;letter-spacing:.6px}.detail-title{display:flex;align-items:flex-start;gap:12px;margin:12px 0 22px}.detail-title h2{margin:2px 0 7px;font-size:22px;letter-spacing:-.5px}.detail-title p{margin:0;color:var(--secondary);font-size:12px}.detail-title .btn{margin-left:auto}.detail-section{padding:18px 0;border-top:1px solid var(--line)}.detail-section h3{margin:0 0 13px;font-size:12px;font-weight:600}.property{display:grid;grid-template-columns:90px 1fr;gap:12px;margin:12px 0;font-size:12px}.property dt{color:var(--muted)}.property dd{margin:0;overflow-wrap:anywhere}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.related-item{display:flex;align-items:center;gap:9px;padding:10px 0;color:var(--secondary)}.related-item svg{color:#6b7f95}
    dialog{width:min(560px,90vw);padding:0;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:#15223555;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:17px}.dialog-head button{margin-left:auto}.dialog-body{padding:8px 20px 20px}.toast{position:fixed;right:24px;bottom:80px;z-index:50;padding:11px 15px;border-radius:9px;background:#202a38;color:#fff;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1200px){.app{grid-template-columns:190px minmax(0,1fr)}.content,.systembar{padding-left:20px;padding-right:20px}.focus-layout{grid-template-columns:145px 310px minmax(300px,1fr)}.native-table th:nth-child(3){display:none}.native-table td:nth-child(3){display:none}.native-table th:nth-child(1){width:34%}.native-table th:nth-child(2){width:30%}.native-table th:nth-child(4){width:36%}}
    @media(max-width:1000px){.app{grid-template-columns:72px minmax(0,1fr);min-width:760px}.sidebar{padding-inline:10px}.brand{padding-inline:6px}.brand>div:last-child,.side-label,.side-nav button span,.side-status,.side-bottom button span{display:none}.side-nav button{justify-content:center;padding:11px}.traffic{margin-inline:7px}.focus-layout{grid-template-columns:130px 280px minmax(280px,1fr)}.focus-detail{padding:20px}.card-grid{grid-template-columns:1fr}.native-summary{grid-template-columns:repeat(2,1fr)}.globalbar{padding-inline:18px}.system-meta{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <div class="brand"><div class="brand-mark" data-icon="grid"></div><div><strong>Clever Workbench</strong><small>个人工作台</small></div></div>
      <div class="side-label">工作空间</div>
      <nav class="side-nav" aria-label="主导航">
        <button data-icon="home"><span>工作台</span></button>
        <button class="active" data-icon="layers"><span>台账</span></button>
        <button data-icon="task"><span>任务</span></button>
        <button data-icon="document"><span>文档</span></button>
        <button data-icon="tool"><span>工具</span></button>
        <button data-icon="chart"><span>工作回顾</span></button>
      </nav>
      <div class="side-status"><span><i class="dot"></i>本地工作空间</span><span>离线可用</span></div>
      <div class="side-bottom"><button data-icon="archive"><span>项目档案</span></button><button data-icon="trash"><span>回收站</span></button><button data-icon="settings"><span>设置</span></button></div>
    </aside>
    <main class="workspace">
      <header class="globalbar">
        <label class="global-search"><span data-icon="search"></span><input placeholder="搜索系统、账号、任务与文档" /><kbd>⌘ K</kbd></label>
        <div class="global-actions"><button class="btn ghost" data-toast="使用指引为演示入口">使用指引</button><button class="btn primary" data-toast="演示：打开统一新建">＋ 新建</button></div>
      </header>
      <div class="systembar">
        <button class="system-picker" data-toast="演示：切换系统"><span data-icon="layers"></span>费控系统<span data-icon="chevron"></span></button>
        <span class="system-meta">3 个环境 · 本地资料</span>
        <div class="global-actions"><button class="btn ghost" data-toast="演示：相关工作">相关工作</button><button class="btn icon" data-toast="演示：更多系统操作" aria-label="更多" data-icon="more"></button><button class="btn icon" data-toast="已收藏费控系统" aria-label="收藏" data-icon="star"></button></div>
      </div>
      <div id="content" class="content"></div>
    </main>
  </div>
  <nav class="demo-switch" aria-label="设计稿切换">
    <button data-layout="native" class="active">A 原生紧凑<small>表格效率</small></button>
    <button data-layout="cards">B 卡片浏览<small>视觉层次</small></button>
    <button data-layout="focus">C 列表＋详情<small>连续查阅</small></button>
  </nav>
  <dialog id="detailDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="btn icon" id="closeDialog" aria-label="关闭" data-icon="close"></button></div><div class="dialog-body" id="dialogBody"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const icons={
      grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
      home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',task:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',document:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 12h6M9 16h6"/>',tool:'<path d="m14 6 4-3 3 3-3 4M4 20 15 9M3 12l4-4 6 6-4 4z"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',archive:'<path d="M4 8v12h16V8M3 3h18v5H3zM9 12h6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7a7 7 0 0 0-.7-1.7l.9-1.9-2.1-2.1-1.9.9a7 7 0 0 0-1.7-.7L10.5 2h-3l-.7 2a7 7 0 0 0-1.7.7L3.2 3.8 1.1 5.9 2 7.8a7 7 0 0 0-.7 1.7l-2 .7v3l2 .7a7 7 0 0 0 .7 1.7l-.9 1.9 2.1 2.1 1.9-.9a7 7 0 0 0 1.7.7l.7 2h3l.7-2a7 7 0 0 0 1.7-.7l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .7-1.7z" transform="translate(2 0) scale(.9)"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',chevron:'<path d="m8 10 4 4 4-4"/>',more:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',plus:'<path d="M12 5v14M5 12h14"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',external:'<path d="M14 4h6v6M20 4l-9 9M18 13v7H4V6h7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',server:'<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/>',deploy:'<path d="m12 2 3 5 5 1-3 4v7l-5 3-5-3v-7L4 8l5-1z"/>',operation:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2M5 2l-2 2M19 2l2 2"/>',check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',edit:'<path d="m4 20 4-1 11-11-3-3L5 16zM14 6l3 3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>'
    };
    function icon(name,size=17){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.document}</svg>`}
    function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon,el.dataset.size||17)+el.innerHTML})}
    const categories=[
      {id:'access',label:'访问入口',icon:'link',noun:'入口'}, {id:'accounts',label:'账号',icon:'account',noun:'账号'},
      {id:'servers',label:'服务器',icon:'server',noun:'服务器'}, {id:'resources',label:'数据库／中间件',icon:'database',noun:'资源'},
      {id:'services',label:'应用部署',icon:'deploy',noun:'应用'}, {id:'operations',label:'运行维护',icon:'operation',noun:'运维'},
      {id:'documents',label:'文档',icon:'document',noun:'文档'}
    ];
    const data={
      access:[
        {name:'费控系统 · 生产',value:'https://finance.example.internal',note:'生产环境主入口',env:'生产',status:'运行正常',accounts:'2 个账号'},
        {name:'费控系统 · 测试',value:'https://finance-test.example.internal',note:'联调与验收环境',env:'测试',status:'运行正常',accounts:'1 个账号'},
        {name:'持续集成平台',value:'https://ci.example.internal/finance',note:'费控系统构建与发布',env:'系统通用',status:'常用入口',accounts:'1 个账号'}],
      accounts:[
        {name:'finance_admin',value:'费控系统 · 生产',note:'费用管理员 · 主账号',env:'生产',status:'密码受保护',accounts:'系统账号'},
        {name:'release_bot',value:'持续集成平台',note:'发布作业专用账号',env:'系统通用',status:'Token 受保护',accounts:'服务账号'},
        {name:'finance_readonly',value:'费控系统 · 测试',note:'只读验收账号',env:'测试',status:'密码受保护',accounts:'系统账号'}],
      servers:[
        {name:'生产应用服务器 01',value:'172.16.0.21:22',note:'应用节点 · 8C16G / Ubuntu 24.04',env:'生产',status:'运行正常',accounts:'2 个账号'},
        {name:'生产数据库服务器',value:'172.16.0.31:22',note:'数据库节点 · 16C64G',env:'生产',status:'运行正常',accounts:'1 个账号'},
        {name:'开发测试服务器 94',value:'172.16.0.94:22',note:'开发环境的测试服务器',env:'测试',status:'运行正常',accounts:'1 个账号'}],
      resources:[
        {name:'费控主数据库',value:'172.16.0.31:5432',note:'PostgreSQL 17 · 主实例',env:'生产',status:'运行正常',accounts:'2 个账号'},
        {name:'订单缓存',value:'172.16.0.42:6379',note:'Redis 8 · 生产集群',env:'生产',status:'需要关注',accounts:'1 个账号'},
        {name:'测试消息队列',value:'172.16.0.94:5672',note:'RabbitMQ · 联调环境',env:'测试',status:'运行正常',accounts:'1 个账号'}],
      services:[
        {name:'费控 Web',value:'git.example/finance/web',note:'3 个节点 · 固定部署',env:'生产',status:'运行正常',accounts:'v3.8.1'},
        {name:'费用计算服务',value:'git.example/finance/calculator',note:'2 个节点 · 固定部署',env:'生产',status:'运行正常',accounts:'v2.14.0'},
        {name:'报表导出服务',value:'git.example/finance/report',note:'1 个节点 · 按需运行',env:'测试',status:'按需运行',accounts:'v1.6.2'}],
      operations:[
        {name:'数据库慢查询巡检',value:'每天 09:30',note:'运行作业 · 生产数据库',env:'生产',status:'在用',accounts:'上次运行正常'},
        {name:'费控数据库完整备份',value:'每天 02:00',note:'备份策略 · 保留 14 天',env:'生产',status:'在用',accounts:'恢复待验证'},
        {name:'测试环境临时数据清理',value:'每周日 23:00',note:'运行作业 · 测试环境',env:'测试',status:'停用',accounts:'已暂停'}],
      documents:[
        {name:'生产缓存排障记录',value:'更新于 11月1日',note:'Redis / 连接池 / 排障方案',env:'生产',status:'已关联系统',accounts:'6 个章节'},
        {name:'费控系统发布检查清单',value:'更新于 10月28日',note:'发布前检查与回退步骤',env:'系统通用',status:'已关联系统',accounts:'12 个章节'},
        {name:'测试环境初始化说明',value:'更新于 10月19日',note:'测试数据与账号初始化',env:'测试',status:'已关联系统',accounts:'4 个章节'}]
    };
    let layout='native',category='servers',selectedId=null,query='',environment='all';
    const content=document.querySelector('#content'),toast=document.querySelector('#toast');
    let toastTimer;
    function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function currentCategory(){return categories.find(c=>c.id===category)}
    function rows(){return data[category].filter(r=>(environment==='all'||r.env===environment)&&(`${r.name}${r.value}${r.note}`.toLowerCase().includes(query.toLowerCase())))}
    function envBadge(r){return `<span class="badge ${r.env==='生产'?'blue':''}">${r.env}</span>`}
    function statusBadge(r){return `<span class="badge ${r.status==='需要关注'?'orange':r.status==='停用'?'':'green'}">${r.status}</span>`}
    function recordIcon(r){return `<span class="record-icon ${category==='servers'?'server':category==='accounts'?'account':category==='documents'?'document':''}">${icon(currentCategory().icon,18)}</span>`}
    function tabs(){return `<nav class="category-tabs" aria-label="系统资料类型">${categories.map(c=>`<button data-category="${c.id}" class="${c.id===category?'active':''}" aria-pressed="${c.id===category}">${icon(c.icon,15)}${c.label}</button>`).join('')}</nav>`}
    function filters(){return `<div class="filters"><label class="search">${icon('search',16)}<input id="ledgerSearch" value="${query}" placeholder="搜索${currentCategory().label}…" aria-label="搜索台账清单" /></label><select id="environment" aria-label="环境筛选"><option value="all">全部环境</option><option ${environment==='生产'?'selected':''}>生产</option><option ${environment==='测试'?'selected':''}>测试</option><option ${environment==='系统通用'?'selected':''}>系统通用</option></select><button class="btn" data-toast="演示：标签筛选">全部标签${icon('chevron',13)}</button></div>`}
    function actionButtons(){return `<div class="global-actions"><button class="btn ghost" data-toast="演示：录入指引">录入指引</button><button class="btn" data-toast="演示：批量录入">批量录入</button><button class="btn primary" data-toast="演示：新增${currentCategory().noun}">${icon('plus',15)}新增${currentCategory().noun}</button></div>`}
    function metrics(){return `<div class="native-summary"><div class="metric">${icon(currentCategory().icon,20)}<div><strong>${data[category].length}</strong><small>${currentCategory().noun}记录</small></div></div><div class="metric">${icon('check',20)}<div><strong>${data[category].filter(r=>r.status!=='需要关注').length}</strong><small>状态正常</small></div></div><div class="metric">${icon('layers',20)}<div><strong>3</strong><small>适用环境</small></div></div><div class="metric">${icon('account',20)}<div><strong>6</strong><small>关联账号</small></div></div></div>`}
    function nativeView(){
      const list=rows();
      return `${tabs()}<div class="category-head"><div class="category-title"><h1>${currentCategory().label}</h1><span>集中维护与快速查找</span></div>${actionButtons()}</div>${filters()}${metrics()}<div class="count-line"><strong>${list.length} 条记录</strong><span>选择当前结果</span><span>已选 0 项</span></div><section class="native-table" aria-label="${currentCategory().label}清单"><table><thead><tr><th>名称</th><th>${category==='operations'?'频率':'地址／信息'}</th><th>说明</th><th>快捷操作</th></tr></thead><tbody>${list.map(r=>`<tr data-row="${r.name}" class="${selectedId===r.name?'selected':''}"><td><div class="name-cell">${recordIcon(r)}<div class="trunc"><strong>${r.name}</strong><small>${r.env} · ${r.accounts}</small></div></div></td><td><span class="${category==='servers'||category==='resources'?'mono':''}">${r.value}</span></td><td><span class="secondary">${r.note}</span></td><td><div class="row-actions"><button data-copy="${r.value}" aria-label="复制资料">${icon('copy',14)}复制</button><button data-detail="${r.name}">详情${icon('chevron',12)}</button></div></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">没有符合条件的记录</div>':''}</section>`;
    }
    function cardsView(){
      const list=rows();
      return `${tabs()}<section class="card-hero"><div><h1>${currentCategory().label}</h1><p>用更直观的方式查看状态、环境和关联资料。</p></div><div class="hero-count">${list.length}<span class="muted" style="font-size:11px;font-weight:400"> 条</span></div>${actionButtons()}</section>${filters()}<div class="card-grid">${list.map(r=>`<article class="record-card ${selectedId===r.name?'selected':''}" data-detail="${r.name}"><div class="card-top">${recordIcon(r)}<h3>${r.name}</h3>${envBadge(r)}</div><div class="card-value ${category==='servers'||category==='resources'?'mono':''}">${r.value}</div><p class="card-note">${r.note}</p><div class="card-foot">${statusBadge(r)}<span>${r.accounts}</span><button data-detail="${r.name}" aria-label="查看详情">详情${icon('chevron',13)}</button></div></article>`).join('')}</div>${!list.length?'<div class="empty">没有符合条件的记录</div>':''}`;
    }
    function detailMarkup(r){return `<div class="detail-eyebrow">${currentCategory().label} / ${r.env}</div><div class="detail-title">${recordIcon(r)}<div><h2>${r.name}</h2><p>${r.note}</p></div><button class="btn" data-toast="演示：编辑 ${r.name}">${icon('edit',14)}编辑</button></div><div class="detail-section"><h3>基本资料</h3><dl><div class="property"><dt>名称</dt><dd>${r.name}</dd></div><div class="property"><dt>${category==='operations'?'频率':'地址／信息'}</dt><dd class="${category==='servers'||category==='resources'?'mono':''}">${r.value}</dd></div><div class="property"><dt>适用环境</dt><dd>${envBadge(r)}</dd></div><div class="property"><dt>当前状态</dt><dd>${statusBadge(r)}</dd></div></dl></div><div class="detail-section"><h3>关联与操作</h3><div class="related-item">${icon('account',16)}${r.accounts}</div><div class="related-item">${icon('document',16)}2 篇相关方案与操作记录</div><div class="detail-actions"><button class="btn primary" data-copy="${r.value}">${icon('copy',14)}复制资料</button><button class="btn" data-toast="演示：打开相关工作">相关工作</button></div></div>`}
    function focusView(){
      const list=rows(),selected=list.find(r=>r.name===selectedId)||list[0];selectedId=selected?.name||null;
      return `<div class="focus-layout"><nav class="focus-categories" aria-label="系统资料类型">${categories.map(c=>`<button data-category="${c.id}" class="${c.id===category?'active':''}">${icon(c.icon,16)}${c.label}<span>${data[c.id].length}</span></button>`).join('')}</nav><section class="focus-list"><div class="focus-list-head"><h1>${currentCategory().label}</h1><label class="search">${icon('search',15)}<input id="ledgerSearch" value="${query}" placeholder="搜索…" /></label><select id="environment"><option value="all">全部环境</option><option ${environment==='生产'?'selected':''}>生产</option><option ${environment==='测试'?'selected':''}>测试</option><option ${environment==='系统通用'?'selected':''}>系统通用</option></select></div><div class="focus-rows">${list.map(r=>`<button class="focus-row ${selectedId===r.name?'selected':''}" data-select="${r.name}"><strong>${r.name}</strong><div class="trunc ${category==='servers'||category==='resources'?'mono':''}">${r.value}</div><small>${r.env} · ${r.accounts}</small></button>`).join('')}${!list.length?'<div class="empty">没有匹配记录</div>':''}</div></section><aside class="focus-detail">${selected?detailMarkup(selected):'<div class="empty">选择一条记录查看详情</div>'}</aside></div>`;
    }
    function render(){
      content.innerHTML=layout==='native'?nativeView():layout==='cards'?cardsView():focusView();
      document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('active',b.dataset.layout===layout));
      bind();hydrate(content);
    }
    function showDetail(name){const r=data[category].find(x=>x.name===name);if(!r)return;selectedId=name;document.querySelector('#dialogTitle').textContent=r.name;document.querySelector('#dialogBody').innerHTML=detailMarkup(r);hydrate(document.querySelector('#dialogBody'));document.querySelector('#detailDialog').showModal();bind()}
    function bind(){
      content.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;selectedId=null;query='';environment='all';render()});
      content.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.select;render()});
      content.querySelectorAll('[data-detail]').forEach(b=>b.onclick=e=>{e.stopPropagation();showDetail(b.dataset.detail)});
      content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();navigator.clipboard?.writeText(b.dataset.copy);notify('已复制到剪贴板')});
      const search=content.querySelector('#ledgerSearch');if(search)search.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const next=content.querySelector('#ledgerSearch');next.focus();next.setSelectionRange(pos,pos)};
      const env=content.querySelector('#environment');if(env)env.onchange=e=>{environment=e.target.value;selectedId=null;render()};
      document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>notify(b.dataset.toast));
    }
    document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;selectedId=null;render()});
    document.querySelector('#closeDialog').onclick=()=>document.querySelector('#detailDialog').close();
    document.querySelector('#detailDialog').addEventListener('click',e=>{if(e.target.id==='detailDialog')e.target.close()});
    hydrate();render();
  </script>
</body>
</html>
